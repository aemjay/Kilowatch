# Nur als lokales Ziel für die vorhandene Pulse-Bridge.
# Firmware hat oft keinen konfigurierbaren Benutzernamen: daher anonyme,
# eng auf zwei Topics begrenzte Verbindung. DSM-Firewall: nur Bridge-IP.
listener 1883 0.0.0.0
allow_anonymous true
acl_file /mosquitto/config/acl
persistence false
max_connections 4
max_packet_size 65536
max_queued_messages 20
log_dest stdout
log_type error
log_type warning
log_type notice
