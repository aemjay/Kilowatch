# Fertiges Image aus der GitHub Container Registry. Enthält bewusst keinen Build.
name: kilowatch
services:
  kilowatch:
    # Standard: neueste 1.x-Version (Fehlerbehebungen und neue Funktionen, keine inkompatiblen Änderungen).
    # Für eine feste Version KILOWATCH_VERSION=1.2.3 in der .env setzen.
    image: ghcr.io/aemjay/kilowatch:${KILOWATCH_VERSION:-1}
    # Leer = Plattform des Hosts. Wird von tools/setup.py in .env gesetzt.
    platform: ${KILOWATCH_PLATFORM:-}
    container_name: kilowatch
    restart: unless-stopped
    init: true
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8088}:8080"
    environment:
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DEMO_MODE: ${DEMO_MODE:-false}
      PUID: ${PUID:-}
      PGID: ${PGID:-}
      TZ: Europe/Berlin
    volumes:
      # Messdaten und tägliche Sicherungen im Projektordner (sichtbar und mitgesichert).
      - ./data:/data
      # Zugangsdaten bewusst getrennt in einem Docker-Volume, nicht im Projektordner.
      - kilowatch-secrets:/secrets
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    # Nur für das Startskript (Eigentümer setzen, Benutzer wechseln); die App selbst läuft ohne.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
volumes:
  kilowatch-secrets:
    name: kilowatch-secrets
