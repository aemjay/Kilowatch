name: Kilowatch - Tests und NAS-Image
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release v<App-Version> aus main anlegen (Tag, Images 1.2.3/1.2/1/latest, Importdateien)'
        type: boolean
        default: false
permissions:
  contents: read
env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/kilowatch
  # Manuelles Release: Workflow auf main mit release=true starten (für Umgebungen ohne Tag-Push).
  MANUAL_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main' }}
concurrency:
  group: kilowatch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
      - name: Release-Tag passt zur App-Version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(python -c 'import app; print(app.__version__)')" = "$GITHUB_REF_NAME"
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: JavaScript-Syntax pruefen
        run: for file in app/static/*.js; do node --check "$file"; done
      - name: Compose-Dateien validieren
        env:
          MQTT_BIND: 127.0.0.1
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.build.yaml config --quiet
          docker compose -f compose.yaml -f compose.mqtt.yaml config --quiet
  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Version lesen
        run: echo "VERSION=$(python3 -c 'import app; print(app.__version__)')" >> "$GITHUB_ENV"
      - name: QEMU fuer ARM64 einrichten
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: NAS-Image bauen
        run: |
          docker buildx build --platform linux/${{ matrix.arch }} --build-arg VERSION="$VERSION" \
            --cache-from type=gha,scope=${{ matrix.arch }} --cache-to type=gha,mode=max,scope=${{ matrix.arch }} \
            --tag "$IMAGE:$VERSION" --tag "$IMAGE:${VERSION%%.*}" --load .
      - name: Container mit persistentem Datenordner pruefen
        run: |
          wait_healthy() {
            # Unter Emulation startet Python deutlich langsamer.
            for i in $(seq 1 90); do curl -fsS http://127.0.0.1:18088/healthz >/dev/null && return 0; sleep 2; done
            return 1
          }
          # Wie auf dem NAS: Daten als Ordner (gehört zunächst nicht dem App-Benutzer), Zugangsdaten im Volume.
          mkdir -p "$RUNNER_TEMP/kilowatch-data"
          docker volume create kilowatch-ci
          docker run -d --name kilowatch-ci --platform linux/${{ matrix.arch }} --read-only --tmpfs /tmp:rw,size=32m --cap-drop ALL --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER --cap-add SETUID --cap-add SETGID --security-opt no-new-privileges -v "$RUNNER_TEMP/kilowatch-data:/data" --mount source=kilowatch-ci,target=/secrets -p 127.0.0.1:18088:8080 "$IMAGE:$VERSION"
          wait_healthy
          # App-Prozess läuft nicht als root und hat keine Capabilities.
          docker exec -i kilowatch-ci python - < tools/check_unprivileged.py
          test -f "$RUNNER_TEMP/kilowatch-data/live/kilowatch.sqlite3"
          ! docker exec kilowatch-ci test -e /data/live/secrets.key
          python tools/smoke.py --seed --container kilowatch-ci
          docker restart kilowatch-ci
          wait_healthy
          python tools/smoke.py --expect-persisted
      - name: Update von der letzten veroeffentlichten Version pruefen
        if: matrix.arch == 'amd64'
        run: |
          # Daten einer veröffentlichten Version müssen ein Update überstehen. Vor dem ersten Release übersprungen.
          if ! docker pull --platform linux/amd64 "$IMAGE:latest" 2>/dev/null; then echo "Noch kein Release veröffentlicht."; exit 0; fi
          mkdir -p "$RUNNER_TEMP/upgrade-data"
          docker volume create kilowatch-upgrade
          run() { docker run -d --name kilowatch-upgrade --cap-drop ALL --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER --cap-add SETUID --cap-add SETGID -v "$RUNNER_TEMP/upgrade-data:/data" --mount source=kilowatch-upgrade,target=/secrets -p 127.0.0.1:18088:8080 "$1"; }
          docker rm -f kilowatch-ci
          run "$IMAGE:latest"
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:18088/healthz >/dev/null && break; sleep 2; done
          python tools/smoke.py --seed --container kilowatch-upgrade
          docker rm -f kilowatch-upgrade
          run "$IMAGE:$VERSION"
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:18088/healthz >/dev/null && break; sleep 2; done
          python tools/smoke.py --expect-persisted
      - name: Optionalen MQTT-Broker pruefen
        if: matrix.arch == 'amd64'
        run: |
          docker run -d --name kilowatch-mqtt-ci --user 1883:1883 --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,size=8m -p 127.0.0.1:11883:1883 -v "$PWD/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro" -v "$PWD/mosquitto/acl:/mosquitto/config/acl:ro" eclipse-mosquitto:2.0.22
          python tools/mqtt_smoke.py --host 127.0.0.1 --port 11883
      - name: Importdatei fuer NAS ohne Internet erzeugen
        run: |
          mkdir -p dist
          # Beide Tags speichern: compose.yaml verwendet standardmäßig die Hauptversion.
          docker save "$IMAGE:$VERSION" "$IMAGE:${VERSION%%.*}" | gzip > "dist/kilowatch-$VERSION-${{ matrix.arch }}.tar.gz"
          cd dist
          sha256sum "kilowatch-$VERSION-${{ matrix.arch }}.tar.gz" > "kilowatch-$VERSION-${{ matrix.arch }}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: kilowatch-nas-${{ matrix.arch }}
          path: dist/
          retention-days: 14
          compression-level: 0
      - name: Testcontainer aufraeumen
        if: always()
        run: |
          docker logs kilowatch-ci || true
          docker logs kilowatch-mqtt-ci || true
          docker rm -f kilowatch-ci kilowatch-mqtt-ci kilowatch-upgrade || true
          docker volume rm kilowatch-ci kilowatch-upgrade || true
          sudo rm -rf "$RUNNER_TEMP/kilowatch-data" "$RUNNER_TEMP/upgrade-data" || true

  publish:
    # Getestete Quellen als Multi-Arch-Image veröffentlichen: main → edge, Tag v1.2.3 → 1.2.3, 1.2, 1, latest.
    needs: image
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Version lesen
        run: |
          echo "VERSION=$(python3 -c 'import app; print(app.__version__)')" >> "$GITHUB_ENV"
          if [ "$MANUAL_RELEASE" = true ]; then echo "SEMVER=v$(python3 -c 'import app; print(app.__version__)')" >> "$GITHUB_ENV"; fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # SEMVER ist nur beim manuellen Release gesetzt; sonst gilt der Git-Tag.
          tags: |
            type=semver,pattern={{version}},value=${{ env.SEMVER }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.SEMVER }}
            type=semver,pattern={{major}},value=${{ env.SEMVER }}
            type=raw,value=latest,enable=${{ env.MANUAL_RELEASE == 'true' }}
            type=edge,branch=main
          flavor: latest=auto
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@v3
      - name: Image signieren (keyless, GitHub OIDC)
        run: cosign sign --yes "$IMAGE@${{ steps.build.outputs.digest }}"

  release:
    # Importdateien dauerhaft am GitHub-Release, für NAS ohne Internetzugang.
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: kilowatch-nas-*
          path: dist
          merge-multiple: true
      - name: Installationsdateien beilegen
        run: |
          # Feste Namen für den Installer (releases/latest/download/<name>); ohne führenden Punkt.
          cp compose.yaml tools/install.sh tools/update.sh dist/
          cp .env.example dist/env.example
      - name: Release anlegen oder ergänzen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$MANUAL_RELEASE" = true ]; then
            # Manuell: Tag v<App-Version> auf genau dem getesteten Commit anlegen.
            TAG="v$(python3 -c 'import app; print(app.__version__)')"
            CREATE_ARGS=(--target "$GITHUB_SHA")
          else
            TAG="$GITHUB_REF_NAME"
            CREATE_ARGS=(--verify-tag)
          fi
          # Ein bereits angelegtes Release (samt Tag) wird nur um die Importdateien ergänzt.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            # Schemastand für den Update-Hinweis ("Update ändert die Datenbank"); GitHub stellt ihn den erzeugten Notizen voran.
            SCHEMA="$(python3 -c 'from app.storage import SCHEMA_VERSION; print(SCHEMA_VERSION)')"
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "Kilowatch ${TAG#v}" --notes "<!-- schema: $SCHEMA -->" --generate-notes "${CREATE_ARGS[@]}"
          fi
