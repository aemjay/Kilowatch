<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#17242b">
  <title>Kilowatch · Energie zu Hause</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/configure.js" defer></script>
  <script src="/extras.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <section id="login" class="login-screen" hidden>
    <div class="login-art"><div class="brand"><span class="brand-icon">↯</span> kilowatch<span class="brand-dot">.</span></div><div class="login-copy"><div class="orbit"><span>↯</span></div></div></div>
    <form id="login-form" class="login-form"><h2>Anmelden</h2><label>Passwort<input id="login-password" type="password" autocomplete="current-password" required autofocus></label><button class="primary" type="submit">Kilowatch öffnen <span>→</span></button><p id="login-error" role="alert" class="error-text"></p></form>
    <form id="first-start-form" class="login-form" hidden><span class="small-pill">ERSTEINRICHTUNG · SCHRITT 1 VON 2</span><h2>App-Passwort festlegen</h2><p>Setup-Code: Container-Protokoll.</p><label>Setup-Code<input name="setup_code" autocomplete="off" required></label><label>Eigenes App-Passwort<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="500" required></label><label>App-Passwort wiederholen<input name="confirmation" type="password" autocomplete="new-password" minlength="12" maxlength="500" required></label><button class="primary" type="submit">Einrichten und fortfahren <span>→</span></button><p id="setup-error" class="error-text" role="alert"></p></form>
  </section>
  <div id="application" class="application" hidden>
    <aside class="sidebar">
      <a href="#dashboard" class="brand"><span class="brand-icon">↯</span> kilowatch<span class="brand-dot">.</span></a>
      <div class="home-label"><span class="home-symbol">⌂</span><div><strong id="home-name">Mein Zuhause</strong></div><span class="home-dot"></span></div>
      <p class="nav-label">ENERGIE IM BLICK</p>
      <nav aria-label="Hauptnavigation">
        <button data-page="dashboard" class="active"><span>◫</span> Übersicht</button>
        <button data-page="history"><span>⌁</span> Verlauf</button>
        <button data-page="analysis"><span>▥</span> Analysen</button>
        <button data-page="costs"><span>€</span> Kosten & Tarife</button>
        <button data-page="events"><span>⚑</span> Ereignisse</button>
        <button data-page="notifications"><span>♧</span> Benachrichtigungen</button>
        <button data-page="reports"><span>▤</span> Berichte & Export</button>
      </nav>
      <div class="sidebar-bottom"><button data-page="settings" class="nav-bottom"><span>⚙</span> Einstellungen</button><button data-page="system" class="nav-bottom"><span>◉</span> System & Datenqualität</button><button id="logout" class="nav-bottom"><span>↪</span> Abmelden</button><small class="version">KILOWATCH <span id="version">1.0</span></small></div>
    </aside>
    <main>
      <header class="topbar"><button id="mobile-menu" class="icon-button" aria-label="Menü öffnen">☰</button><span class="breadcrumb">MEIN ZUHAUSE <span>/</span> <b id="breadcrumb">ÜBERSICHT</b></span><div class="connection"><span id="status-dot" class="status-dot"></span><span id="status-label">Verbinde …</span><span id="demo-badge" class="demo-badge" hidden>BEISPIELDATEN</span></div></header>
      <div class="content">
        <div class="page-heading"><div><h1 id="page-title">Übersicht</h1></div><div class="date-display"><span>◷</span><div><b id="today-label"></b></div></div></div>
        <div id="connection-alert" class="notice" hidden></div>
        <div id="range-bar" class="range-bar"><div class="segments" aria-label="Zeitraum"><button data-range="today" class="selected">Heute</button><button data-range="yesterday">Gestern</button><button data-range="week">7 Tage</button><button data-range="month">Monat</button><button data-range="year">Jahr</button></div><form id="range-form" class="date-range"><label class="sr-only" for="range-start">Beginn</label><input type="date" id="range-start" required><span>—</span><label class="sr-only" for="range-end">Ende einschließlich</label><input type="date" id="range-end" required><button class="subtle" type="submit">Anzeigen</button></form></div>
        <section id="page-dashboard" class="page"></section>
        <section id="page-history" class="page" hidden></section>
        <section id="page-analysis" class="page" hidden></section>
        <section id="page-costs" class="page" hidden></section>
        <section id="page-events" class="page" hidden></section>
        <section id="page-notifications" class="page" hidden></section>
        <section id="page-reports" class="page" hidden></section>
        <section id="page-settings" class="page" hidden></section>
        <section id="page-system" class="page" hidden></section>
      </div>
    </main>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
