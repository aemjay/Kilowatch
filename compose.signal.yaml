# Optional: docker compose -f compose.yaml -f compose.signal.yaml up -d --build
# Kein veröffentlichter Gateway-Port: Kopplung erfolgt über die App-Oberfläche.
services:
  signal-api:
    image: bbernhard/signal-cli-rest-api:0.101
    restart: unless-stopped
    environment:
      MODE: json-rpc
      JSON_RPC_IGNORE_ATTACHMENTS: "true"
      JSON_RPC_IGNORE_STORIES: "true"
      JSON_RPC_IGNORE_AVATARS: "true"
      JSON_RPC_IGNORE_STICKERS: "true"
    volumes:
      - kilowatch-signal:/home/.local/share/signal-cli
    security_opt: [no-new-privileges:true]
    mem_limit: 1024m
volumes:
  kilowatch-signal:
    name: kilowatch-signal
