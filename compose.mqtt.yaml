# Zusätzlich zur App: docker compose -f compose.yaml -f compose.mqtt.yaml up -d
# Optionaler LAN-Broker; keine feste NAS- oder Bridge-IP erforderlich.
services:
  mqtt:
    container_name: kilowatch-mqtt
    image: eclipse-mosquitto:2.0.22
    user: "1883:1883"
    restart: unless-stopped
    ports:
      - "${MQTT_BIND:-0.0.0.0}:${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
